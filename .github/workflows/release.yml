# Al subir una etiqueta v* (por ejemplo v1.0.0): compila el APK firmado,
# calcula su SHA-256 y lo publica en GitHub Releases.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: APK firmado en Releases
    runs-on: ubuntu-latest
    # Crear el release necesita escribir en el repositorio; nada más.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      # La clave de firma vive solo en los secrets del repositorio, nunca en el código.
      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.LLAVERO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret LLAVERO_KEYSTORE_BASE64 (ver README, sección Publicar una versión)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/llavero.jks"

      - name: Pruebas y APK de release
        env:
          LLAVERO_KEYSTORE_PATH: ${{ runner.temp }}/llavero.jks
          LLAVERO_KEYSTORE_PASSWORD: ${{ secrets.LLAVERO_KEYSTORE_PASSWORD }}
          LLAVERO_KEY_ALIAS: ${{ secrets.LLAVERO_KEY_ALIAS }}
          LLAVERO_KEY_PASSWORD: ${{ secrets.LLAVERO_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verificar la firma y calcular SHA-256
        run: |
          APK="llavero-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" llavero-*.apk llavero-*.apk.sha256 \
            --title "Llavero ${GITHUB_REF_NAME}" --generate-notes

      - name: Borrar la clave del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/llavero.jks"
