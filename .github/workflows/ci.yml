# Compila, corre las pruebas y lint en cada push a main y en cada pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: este flujo solo necesita leer el código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pruebas JVM, lint y APK de depuración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Comprueba que gradle-wrapper.jar sea uno oficial de Gradle y no uno alterado.
      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Pruebas, lint y compilación
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Anotar pruebas fallidas
        if: failure()
        run: python3 .github/scripts/anotar_fallos.py app/build/test-results

      - name: Reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-jvm
          path: app/build/reports

  instrumented:
    name: Pruebas en emulador (Keystore real, interfaz, permisos)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      # El emulador necesita aceleración por hardware (KVM) para ser usable.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pruebas instrumentadas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Gráficos por software: con la GPU emulada por defecto, el emulador del runner
          # fallaba al dibujar ("invalid color buffer") y adb lo veía desconectado.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          script: |
            adb wait-for-device
            ./gradlew connectedDebugAndroidTest

      - name: Anotar pruebas fallidas
        if: failure()
        run: python3 .github/scripts/anotar_fallos.py app/build/outputs/androidTest-results

      - name: Reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-emulador
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
